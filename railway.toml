# Railway configuration for backend service
# Root Directory should be set to "backend" in Railway Settings UI

[build]
# Use Nixpacks instead of Dockerfile for better monorepo support
builder = "NIXPACKS"

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
